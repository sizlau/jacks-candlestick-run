<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 70" width="30" height="70">
  <!-- Flame glow -->
  <ellipse cx="15" cy="10" rx="9" ry="12" fill="#ffb347" opacity="0.35"/>
  <!-- Flame -->
  <path d="M 15 2 Q 20 10 15 18 Q 10 10 15 2 Z" fill="#ff9d1f"/>
  <path d="M 15 7 Q 18 12 15 16 Q 12 12 15 7 Z" fill="#fff1c2"/>
  <!-- Wick -->
  <rect x="14.3" y="16" width="1.4" height="5" fill="#3a2417"/>
  <!-- Candle body -->
  <rect x="8" y="20" width="14" height="44" rx="2" fill="#f5f0e6"/>
  <!-- Wax drip highlight -->
  <path d="M 10 20 Q 9 30 11 40 Q 9 50 10 64" stroke="#e0d8c4" stroke-width="1.5" fill="none"/>
  <!-- Candle base / holder -->
  <rect x="4" y="64" width="22" height="5" rx="1.5" fill="#39e639"/>
  <rect x="9" y="61" width="12" height="4" fill="#2fc42f"/>
</svg>
